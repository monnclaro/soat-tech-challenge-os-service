name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# AWS Academy: credenciais de sessão temporárias (expiram com o Lab), não
# suporta OIDC nem IAM role de longa duração — mesma decisão do monolito de
# origem (soat-tech-challenge), ver docs/adr "Prioridade de custo e AWS Academy".
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  ECR_REPOSITORY: soat-os-service

jobs:
  build-test:
    name: Build, Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # Histórico completo: o SonarCloud usa fetch-depth: 0 para analisar
          # apenas as linhas novas/alteradas num PR (new code period).
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 9.0.x

      # dotnet-sonarscanner roda sobre uma JVM.
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pacotes NuGet
        uses: actions/cache@v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}

      - name: Instalar dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Iniciar análise SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"soat-tech-challenge-os-service" \
            /o:"monnclaro" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      # Threshold=80: o próprio "dotnet test" falha (e o job para) se a cobertura
      # de linha total ficar abaixo de 80% — gate de cobertura exigido pelo
      # enunciado, independente do Quality Gate do SonarCloud (que audita
      # duplicação/bugs/vulnerabilidades/code smells em cima do mesmo relatório).
      - name: Testes com cobertura (gate 80%)
        run: |
          dotnet test --no-build --configuration Release --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./coverage.opencover.xml \
            /p:Threshold=80 \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

      # Falha o job se o Quality Gate do SonarCloud reprovar (sonar.qualitygate.wait=true acima).
      - name: Finalizar análise SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  deploy:
    name: Build image & Deploy
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment: producao
    env:
      ENVIRONMENT: producao
    steps:
      - uses: actions/checkout@v4.2.2

      # Sem Terraform próprio neste repo (infra de cluster é do infra-k8s) —
      # o repositório ECR não existe até algum "docker push" precisar dele.
      # Idempotente: só cria se ainda não existir.
      - name: Garantir repositório ECR
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY"

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f src/Api/Dockerfile .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Atualizar kubeconfig
        run: aws eks update-kubeconfig --name soat-${{ env.ENVIRONMENT }} --region us-east-1

      # Precisa vir antes do Secret abaixo: kubectl apply não cria a
      # namespace sozinho, e "soat-os-api-secret" é criado em "-n soat-os".
      - name: Criar namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Gerar Secret a partir do SSM Parameter Store (RDS + JWT + RabbitMQ)
        run: |
          DB_ENDPOINT=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rds/endpoint" --query Parameter.Value --output text)
          DB_USER=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rds/username" --query Parameter.Value --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rds/password" --with-decryption --query Parameter.Value --output text)
          JWT_SECRET=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/jwt/secret" --with-decryption --query Parameter.Value --output text)
          RABBITMQ_HOST=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rabbitmq/host" --query Parameter.Value --output text)
          RABBITMQ_USER=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rabbitmq/username" --query Parameter.Value --output text)
          RABBITMQ_PASSWORD=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rabbitmq/password" --with-decryption --query Parameter.Value --output text)

          kubectl create secret generic soat-os-api-secret -n soat-os \
            --from-literal=ConnectionStrings__Default="Host=$DB_ENDPOINT;Port=5432;Database=soat_os;Username=$DB_USER;Password=$DB_PASSWORD" \
            --from-literal=JwtSettings__Secret="$JWT_SECRET" \
            --from-literal=JwtSettings__ExpirationHours="2" \
            --from-literal=RabbitMq__Host="$RABBITMQ_HOST" \
            --from-literal=RabbitMq__VirtualHost="/" \
            --from-literal=RabbitMq__Username="$RABBITMQ_USER" \
            --from-literal=RabbitMq__Password="$RABBITMQ_PASSWORD" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifests
        env:
          ECR_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout
        run: kubectl rollout status deployment/soat-os-api -n soat-os --timeout=180s

      - name: Publicar IP público do node em SSM (consumido pelo repo lambda)
        run: |
          # Sem ALB (prioridade de custo): o API Gateway (repo lambda) chama direto
          # o IP público de um node na porta NodePort (k8s/service.yaml). Parâmetro
          # compartilhado entre os 3 microsserviços (mesmo cluster) — qualquer um dos
          # 3 CI/CDs pode republicá-lo.
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
          if [ -n "$NODE_IP" ]; then
            aws ssm put-parameter --name "/soat/${ENVIRONMENT}/app/node-ip" --type String --value "$NODE_IP" --overwrite
          else
            echo "::warning::Nenhum node com IP público encontrado; verifique se os nodes do EKS estão em subnet pública."
          fi
