# Template — NÃO aplicado diretamente. O CI/CD gera o Secret real em tempo de deploy
# (kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -) a partir do
# SSM Parameter Store: RDS (/soat/{env}/rds/*, publicado por infra-database), JWT
# (/soat/{env}/jwt/secret, publicado por infra-k8s) e RabbitMQ
# (/soat/{env}/rabbitmq/*, publicado por infra-k8s junto do Helm release). Evita
# credenciais de produção em texto plano num arquivo versionado. Para rodar
# localmente, preencha os valores abaixo e aplique
# manualmente (ou use docker compose — ver README).

apiVersion: v1
kind: Secret

metadata:
  name: soat-os-api-secret
  namespace: soat-os

type: Opaque

stringData:
  ConnectionStrings__Default: "Host=postgres-service;Port=5432;Database=soat_os;Username=soat_os_user;Password=postgres"
  JwtSettings__Secret: "SuaChaveSuperSecretaComMinimo32Caracteres"
  JwtSettings__ExpirationHours: "2"
  RabbitMq__Host: "rabbitmq.rabbitmq.svc.cluster.local"
  RabbitMq__VirtualHost: "/"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
  NEW_RELIC_LICENSE_KEY: "sua-license-key-newrelic"
