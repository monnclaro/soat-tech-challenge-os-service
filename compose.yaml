version: '3.9'

services:
  api:
    image: soat-os-service-api
    build:
      context: .
      dockerfile: src/Api/Dockerfile

    ports:
      - "8081:8080"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - soat-os-network

    restart: unless-stopped

  # Compartilhado entre os 3 microsserviços quando rodando localmente lado a
  # lado (aponte RabbitMq__Host dos outros serviços para este container, via
  # uma rede Docker externa comum, ou rode-os individualmente contra este
  # broker). Em produção, RabbitMQ é infraestrutura compartilhada de
  # plataforma provisionada no infra-k8s — ver PLANO-FASE-4-MICROSSERVICOS.md.
  rabbitmq:
    image: rabbitmq:3-management-alpine

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - soat-os-network

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - soat_os_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - soat-os-network

    restart: unless-stopped

volumes:
  soat_os_postgres_data:

networks:
  soat-os-network:
