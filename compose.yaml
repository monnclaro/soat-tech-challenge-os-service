version: '3.9'

services:
  api:
    image: soat-os-service-api
    build:
      context: .
      dockerfile: src/Api/Dockerfile

    ports:
      - "8081:8080"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - soat-os-network

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - soat_os_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - soat-os-network

    restart: unless-stopped

volumes:
  soat_os_postgres_data:

networks:
  soat-os-network:
